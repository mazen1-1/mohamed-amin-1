<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
input, button, textarea { width:100%; margin:5px 0; padding:10px; }
.section { border:1px solid #444; padding:10px; margin:10px 0; }
button { background:#e8b84b; border:none; cursor:pointer; }
</style>
</head>
<body>

<h2>⚙️ لوحة التحكم</h2>

<button onclick="loadData()">تحميل البيانات</button>
<button onclick="saveData()">حفظ على GitHub</button>

<div id="app"></div>

<script>
let data = { sections: [] };

// ================== LOAD ==================
async function loadData() {
  const res = await fetch("portfolio-data.json");
  data = await res.json();
  render();
}

// ================== RENDER ==================
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.sections.forEach((section, sIndex) => {
    app.innerHTML += `
      <div class="section">
        <input value="${section.title}" 
          onchange="data.sections[${sIndex}].title=this.value" />

        ${section.videos.map((v, vIndex) => `
          <div>
            <input value="${v.title}" 
              onchange="data.sections[${sIndex}].videos[${vIndex}].title=this.value" />

            <input value="${v.url}" 
              onchange="data.sections[${sIndex}].videos[${vIndex}].url=this.value" />

            <button onclick="deleteVideo(${sIndex},${vIndex})">حذف فيديو</button>
          </div>
        `).join("")}

        <button onclick="addVideo(${sIndex})">+ فيديو</button>
      </div>
    `;
  });

  app.innerHTML += `<button onclick="addSection()">+ قسم جديد</button>`;
}

// ================== ADD ==================
function addSection() {
  data.sections.push({
    id: "sec_" + Date.now(),
    title: "قسم جديد",
    videos: []
  });
  render();
}

function addVideo(i) {
  data.sections[i].videos.push({
    id: "vid_" + Date.now(),
    title: "فيديو جديد",
    url: ""
  });
  render();
}

function deleteVideo(s, v) {
  data.sections[s].videos.splice(v, 1);
  render();
}

// ================== SAVE TO GITHUB ==================
async function saveData() {
  const token = prompt("GitHub Token");
  const owner = "mazen1-1";
  const repo = "YOUR_REPO_NAME";

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

  await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/portfolio-data.json`, {
    method: "PUT",
    headers: {
      "Authorization": `token ${token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: "update portfolio",
      content: content
    })
  });

  alert("تم الحفظ 🚀");
}
</script>

</body>
</html>
